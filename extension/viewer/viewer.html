<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patens PDF Viewer</title>
  <link rel="stylesheet" href="../content/content.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #18181b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }

    /* 1. Native Adobe / Edge PDF View */
    #pdf-embed {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }

    /* 2. Interactive Converted HTML View (Hidden until swapped) */
    #html-container {
      display: none;
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      background-color: #2a2b2d;
    }

    /* 3. Floating Switch Badge - Centered at Bottom (Clear of native top toolbars) */
    #patens-switch-badge {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      background: #221e1f;
      color: #a1a1aa;
      border: 1px solid #3f3f46;
      border-radius: 24px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: not-allowed;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      backdrop-filter: blur(8px);
    }

    /* Active Glowing State when Background Conversion completes */
    #patens-switch-badge.ready {
      background: #221e1f;
      color: #34d399;
      border-color: #059669;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
    }

    #patens-switch-badge.ready:hover {
      background: #221e1f;
      color: #ffffff;
      transform: translateX(-50%) translateY(-2px);
    }

    .badge-icon {
      width: 16px;
      height: 16px;
      object-fit: contain;
      display: none; /* Shown when conversion completes */
    }

    .badge-spinner {
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top: 2px solid #a1a1aa;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Floating Switch Badge (Centered at Bottom) -->
  <div id="patens-switch-badge">
    <div id="badge-spinner" class="badge-spinner"></div>
    <img id="badge-icon" class="badge-icon" src="../assets/icon48.png" alt="Patens Icon">
    <span id="badge-text">Converting for Patens...</span>
  </div>

  <!-- View 1: Native PDF View (0ms load) -->
  <embed id="pdf-embed" type="application/pdf">

  <!-- View 2: High-Fidelity Patens HTML View -->
  <div id="html-container"></div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
