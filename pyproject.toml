[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-clipboard"
version = "1.1.0"
description = "Context Clipboard local backend and MCP server"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "fastmcp",
    "pyyaml",
    "fastembed",
    "sqlite-vec"
]

[project.scripts]
context-clipboard = "context_clipboard.main:main"

[tool.setuptools.packages.find]
where = ["src"]