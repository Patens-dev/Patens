[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Patens"
version = "1.1.2"
authors = [
    {name = "Patens"}
]
description = "A fast and efficient MCP server for your applications."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "fastmcp",
    "pyyaml",
    "fastembed",
    "sqlite-vec"
]

[project.scripts]
patens = "patens.main:main"

[tool.setuptools.packages.find]
where = ["src"]